function type(value){draft=(draft+value).slice(0,180);document.querySelector('#draft').textContent=draft}function erase(){draft=Array.from(draft).slice(0,-1).join('');document.querySelector('#draft').textContent=draft}
function send(){if(draft==='/gps'){draft='';gpsGroup='';show('gps')}else if(draft==='/map'){draft='';show('map')}else{draft='';show('hud')}}
function keyboard(){const box=document.querySelector('.keyboard');box.innerHTML='';const rows=symbols?['1234567890','@#₽%&*()-+','_=:;"\'?!.']:ru?['йцукенгшщзхъ','фывапролджэ','ячсмитьбю']:['qwertyuiop','asdfghjkl','zxcvbnm'];function key(row,label,fn,weight=1,primary=false){const b=document.createElement('button');b.className='key'+(primary?' primary':'');b.textContent=label;b.style.flex=weight;b.onclick=fn;row.append(b)}rows.forEach((r,i)=>{const row=document.createElement('div');row.className='keyrow';if(i===2)key(row,shift?'⇧ ON':'⇧',()=>{shift=!shift;keyboard()});for(let ch of r){const value=shift?ch.toUpperCase():ch;key(row,value,()=>{type(value);if(shift&&!symbols){shift=false;keyboard()}})}if(i===2)key(row,'⌫',erase);box.append(row)});const row=document.createElement('div');row.className='keyrow';key(row,'/',()=>type('/'));key(row,ru?'RU':'EN',()=>{ru=!ru;symbols=false;keyboard()});key(row,symbols?'ABC':'123',()=>{symbols=!symbols;keyboard()});key(row,'Пробел',()=>type(' '),5);key(row,',',()=>type(','));key(row,'.',()=>type('.'));key(row,'→',send,1.6,true);box.append(row)}
addEventListener('keydown',e=>{if(scene!=='chat')return;if(e.key==='Backspace'){e.preventDefault();erase()}else if(e.key==='Enter'){e.preventDefault();send()}else if(e.key==='Escape')show('hud');else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey)type(e.key)});
sceneSelect.onchange=()=>show(sceneSelect.value);const requested=new URLSearchParams(location.search).get('scene')||'login';show(requested);
</script></html>
