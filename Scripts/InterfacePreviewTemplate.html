<!doctype html><html lang="ru"><meta charset="utf-8"><title>Макет интерфейса</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a0e;color:white;font:18px Arial,sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer;border:0;color:white;border-radius:10px;background:#292c34;padding:15px 22px;font-weight:700}button:hover{filter:brightness(1.16)}button:active{transform:translateY(1px)}button.primary{background:linear-gradient(105deg,#fb3214,#df1c09)}button:disabled{cursor:default;filter:brightness(.45)}button.selected{box-shadow:inset 0 0 0 2px #f23819;background:#49241f}input{display:block;width:100%;height:76px;margin:0 0 16px;padding:17px 22px;border:1px solid #777a82;border-radius:9px;background:#1c1e23f5;color:white;outline:0;font-size:27px}input:focus{border-color:#f33419}input::placeholder{color:#a2a4aa}.screen{width:1280px;height:720px;position:absolute;transform-origin:top left;overflow:hidden;background:#11151a}.art{background:linear-gradient(#0002,#0002),url('../Branding/CityLiveLoginCity.png') center/cover}.accountart{background:linear-gradient(#0002,#0002),url('../Branding/CityLiveAccountCity.png') center/cover}.spawnart{background:linear-gradient(#050608eb,#050608eb),url('../Branding/CityLiveLoginCity.png') center/cover}.world{background:linear-gradient(#070c1538,#0a0d1822),url('../Maps/PoliceDistrictRealistic/StreetRealistic.png') center/cover}h1{margin:0;font-size:34px}.pageheading{position:absolute;left:52px;top:40px}.identity{position:absolute;width:430px;left:52px;top:276px}.next{position:absolute;right:52px;bottom:44px;width:300px;height:72px;font-size:26px}.account{position:absolute;right:82px;top:218px;width:500px}.account.returning{top:265px}.passwordfield{position:relative}.passwordfield input{padding-right:78px}.eye{position:absolute;right:10px;top:15px;padding:8px 9px;height:46px;display:grid;place-items:center}.account .submit{width:100%;height:72px;margin-top:5px;font-size:26px}.back{display:block;margin:17px auto 0;font-size:17px;padding:8px 16px;font-weight:400}.nick{position:absolute;right:82px;top:156px;width:500px;font-size:24px;font-weight:700}.error{font-size:19px;color:#ff8d77;line-height:1.4;margin-top:18px}.identity .error{position:absolute;top:190px;width:430px}.spawnheading{font-size:34px}.spawncards{position:absolute;left:52px;right:52px;top:189px;height:342px;display:flex;gap:14px}.spawncard{position:relative;flex:1;min-width:0;border:3px solid #535660;border-radius:6px;overflow:hidden;background-size:cover;background-position:center;padding:0;display:grid;place-items:center}.spawncard:after{content:'';position:absolute;inset:0;background:#0007}.spawncard b{position:relative;z-index:1;font-size:23px}.spawncard.selected{border-color:#f33419;box-shadow:0 0 24px #f3341933}.spawnenter{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);width:270px;height:72px;font-size:26px}.mini{position:absolute;top:18px;right:22px;width:218px;height:218px;border:1.5px solid #c9ccd6;border-radius:50%;overflow:hidden;background:#11141a;cursor:pointer}.mini svg{width:100%;height:100%}.chatbox{position:absolute;left:26px;top:22px;width:850px;height:218px;padding:12px;background:#0d101b77;border-radius:10px;font-size:18px;line-height:1.45;cursor:pointer;overflow:hidden}.chatbox .sys{color:#ffb668}.balance{position:absolute;right:35px;top:247px;font-size:30px;font-style:italic;font-weight:800;text-shadow:2px 2px 3px #000}.navsmall{position:absolute;right:30px;top:291px;width:225px;font-size:16px;color:#ff9a49;font-weight:bold}.round{position:absolute;border:1.5px solid #ddd;border-radius:50%;width:112px;height:112px;display:grid;place-items:center;background:#171b2470}.run{right:34px;bottom:59px}.interact{right:calc(24% - 37px);bottom:78px;width:74px;height:74px;border-color:#ff4021;background:#b22214da}.interact svg{width:34px;height:40px}.panel{position:absolute;padding:26px;border-radius:12px;background:#17191ff5}.gps{width:560px;height:650px;left:calc(50% - 280px);top:35px}.gps h1{font-size:29px;margin-bottom:20px}.gps .rows{max-height:490px;overflow:auto;margin:10px 0}.gps .rows.destinations{height:310px}.rows button{display:block;width:100%;padding:14px 16px;text-align:left;margin:8px 0;font-size:21px}.gps footer{display:flex;gap:10px;margin-top:14px}.gps footer button{flex:1;font-size:18px}.rows::-webkit-scrollbar{width:7px}.rows::-webkit-scrollbar-thumb{background:#e73319;border-radius:4px}.darken{position:absolute;inset:0;background:#03050ab3}.close{position:absolute;right:28px;top:24px;font-size:27px;padding:8px 20px;z-index:8}.map{position:absolute;inset:0;background:#11151b}.map svg{width:100%;height:100%;touch-action:none}.maptitle{position:absolute;left:32px;top:26px;font-weight:bold;font-size:24px;pointer-events:none}.mapinfo{position:absolute;right:28px;bottom:28px;width:370px;padding:18px;border-radius:12px;background:#17191ff7}.mapinfo h2{font-size:22px;margin:0 0 12px}.mapinfo p{color:#ff7924;font-size:16px}.mapinfo button{width:100%;font-size:18px}.legendtoggle{position:absolute;left:30px;top:78px;font-size:17px}.opengps{position:absolute;left:30px;top:142px;font-size:20px}.legend{position:absolute;bottom:28px;left:28px;background:#17191ff7;border-radius:12px;padding:18px;font-size:15px;line-height:1.8;display:none}.keyboard{position:absolute;left:0;right:0;bottom:0;height:330px;background:#17191ff2;border-radius:0;padding:10px;display:grid;grid-template-rows:repeat(4,1fr);gap:2px}.keyrow{display:flex;gap:6px}.key{flex:1;border-radius:9px;font-size:22px;padding:3px;min-width:0}.channels{position:absolute;left:16px;right:300px;bottom:418px;display:flex;gap:8px;align-items:center}.channels button{font-size:16px;padding:14px 22px}.channels .history{margin-left:auto}.draft{position:absolute;left:12px;right:12px;bottom:340px;height:66px;background:#17191ff7;border-radius:12px;padding:14px 20px;font-size:27px;white-space:pre;overflow:hidden}.caret{color:#f33419}.chatview .close{left:900px;right:auto;top:22px}.chatview .round,.chatview .navsmall{display:none}.previewbar{position:fixed;height:30px;left:0;right:0;bottom:0;background:#08090c;padding:4px 12px;font:12px Arial;display:flex;align-items:center;gap:10px;color:#969ba9}.previewbar select{background:#22252e;color:#eee;border:0;padding:3px}.previewbar span{margin-left:auto}svg text{font-family:Arial,sans-serif;pointer-events:none}svg .poi{cursor:pointer}
.mini{left:0;right:auto;top:0}.chatbox{left:50%;transform:translateX(-50%);top:18px;width:740px}.balance{right:28px;top:32px;width:148px;padding:9px 14px;text-align:center;font-size:22px;background:#0009;border-radius:8px}.balance:after{content:'';position:absolute;left:9px;right:9px;top:100%;height:18px;border-radius:0 0 70px 70px;background:#e52b1560}.navsmall{top:110px}.chatview .close{left:auto;right:28px;top:122px}
</style><main class="screen" id="screen"></main><nav class="previewbar">Макет интерфейса · не скриншот Unreal <select id="scene"><option value="login">Вход</option><option value="password">Регистрация</option><option value="return">Авторизация</option><option value="spawn">Место появления</option><option value="hud">Игра / HUD</option><option value="gps">GPS</option><option value="map">Карта</option><option value="chat">Клавиатура</option></select><span>Данные макета не сохраняются</span></nav><script>
const DATA=__MAPDATA__,ROUTES=__ROUTES__;
const screen=document.querySelector('#screen'),sceneSelect=document.querySelector('#scene');
let scene='login',nickname='',first='',last='',chosenSpawn='Start',selectedPlace=null,tracked=null,mapZoom=1,draft='',ru=false,shift=false,symbols=false,channel=0,gpsGroup='',selectedGPS=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const close=()=>'<button class="close" onclick="show(\'hud\')">×</button>';
function resize(){const w=Math.max(1280,innerWidth/(innerHeight-30)*720);screen.style.width=w+'px';const k=Math.min(innerWidth/w,(innerHeight-30)/720);screen.style.transform=`scale(${k})`;screen.style.left=(innerWidth-w*k)/2+'px';screen.style.top=(innerHeight-30-720*k)/2+'px'}addEventListener('resize',resize);
function svgMap(mini=false){const route=tracked?ROUTES.find(x=>x.id===tracked.id):null;let s=`<svg viewBox="${mini?'-150 -96 145 145':`${-230/mapZoom} ${-190/mapZoom} ${460/mapZoom} ${380/mapZoom}`}" xmlns="http://www.w3.org/2000/svg"><rect x="-1000" y="-1000" width="2000" height="2000" fill="#101319"/><rect x="-210" y="-170" width="420" height="340" fill="#1b2227"/>`;
 for(const r of DATA.walkways||[])s+=`<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="#303740"/>`;
 for(const a of DATA.parks||[]){const r=a.rect;s+=`<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="${a.kind?'#3b414c':'#574231'}"/>`}
 for(const r of DATA.roads.filter(r=>!r.access))s+=`<path d="M${r.a}L${r.b}" stroke="#747985" stroke-width="${r.width+1}"/><path d="M${r.a}L${r.b}" stroke="#494e5c" stroke-width="${r.width}"/>`;
 for(const r of DATA.markings||[])s+=`<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="#8a8e96"/>`;
 for(const p of DATA.trees)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="#2c4938"/>`;
 for(const b of DATA.buildings){const r=b.rect;s+=`<rect x="${r[0]+1}" y="${r[1]+1}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="#11151b"/><rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="#4e5360" stroke="#6e7481" stroke-width=".6"/>`}
 for(const r of DATA.roofs||[])s+=`<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="#717682"/>`;
 if(!mini)for(const c of DATA.captions||[])s+=`<text x="${c.point[0]}" y="${c.point[1]}" text-anchor="middle" fill="#9da2ad" font-size="6" font-weight="bold" letter-spacing=".4">${c.text}</text>`;
 if(route)for(let i=1;i<route.points.length;i++)s+=`<path d="M${route.points[i-1]}L${route.points[i]}" fill="none" stroke="#ff7924" stroke-width="${mini?2.4:1.8}" ${route.road[i-1]?'':'stroke-dasharray="2 2"'} stroke-linecap="round"/>`;
 const col=['#4797eb','#ff634d','#ff962e','#7dbf63','#ff962e','#ff962e'];const glyph=['<path d="M-2.3-2.9H2.3L1.8 1 0 2.9-1.8 1Z" fill="white"/>','<path d="M-2.5 0H2.5M0-2.5V2.5" stroke="white" stroke-width="1.4"/>','<path d="M-2.1-2H2.1V2.4H-2.1ZM-2.1-2 0 0 2.1-2M0 0V2.4" stroke="white" fill="none" stroke-width=".7"/>','<path d="M-3 0 0-3 3 0H2V2.5H-2V0Z" fill="white"/>','<text y="2.2" fill="white" text-anchor="middle" font-size="6.5" font-weight="bold">P</text>','<path d="M-2.3-1.8H2.3V2.5H-2.3ZM-1.3-1.8V-3H1.3V-1.8" fill="none" stroke="white" stroke-width=".8"/>'];
 for(const p of DATA.places)s+=`<g class="poi" data-id="${p.id}" transform="translate(${p.point})"><circle r="${mini?3.6:5.8}" fill="${col[p.symbol]}" stroke="#10131b" stroke-width="1"/>${mini?'':glyph[p.symbol]}</g>`;
 if(!mini)for(const p of DATA.places.filter(p=>p.symbol<3))s+=`<text x="${p.point[0]+(p.symbol===2?-10:8)}" y="${p.point[1]+(p.symbol===2?13:1)}" fill="#dddfe5" font-size="6.5">${p.label}</text>`;
 if(tracked)s+=`<g transform="translate(${tracked.point})"><circle r="5" fill="#fc4d2b"/><path d="M-4,2L4,2L0,9Z" fill="#fc4d2b"/></g>`;
 if(selectedPlace)s+=`<g transform="translate(${selectedPlace.point})"><circle r="7" fill="#17191f"/><circle r="4.5" fill="#ff7924"/><circle r="1.5" fill="white"/></g>`;
 s+='<circle cx="-78" cy="-24" r="6" fill="#10131b"/><path d="M-73,-24L-82,-28L-80,-24L-82,-20Z" fill="#ffc047"/></svg>';return s}

function hud(){return `<div class="mini" onclick="show('map')">${svgMap(true)}</div><div class="chatbox" onclick="show('chat')"><span class="sys">Добро пожаловать!</span><br>Нажмите на чат, чтобы написать сообщение.<br><span style="color:#b788f3">* Alex_Ivanov осматривается</span><br>Alex_Ivanov: Всем привет!<br><span style="color:#a3a7b3">(( Alex_Ivanov: Как устроиться курьером? ))</span></div><div class="balance">20 000</div><div class="navsmall">${tracked?`${esc(tracked.label)}<br>${Math.round(ROUTES.find(x=>x.id===tracked.id).metres)} м`:''}</div><div class="round run"><svg width="54" height="64" viewBox="0 0 54 64"><circle cx="33" cy="8" r="6" fill="white"/><path d="M28 19L20 36M27 21L39 28L48 19M27 21L15 19L6 28M20 36L33 45L37 58M20 36L9 47L2 45" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><button class="round interact" title="Взаимодействие"><svg viewBox="0 0 34 40"><path d="M12 34 5 21Q3 17 7 17L13 23V7Q13 1 18 4L19 20 26 21Q31 22 29 29L25 36Z" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/></svg></button>`}
const SPAWN_ART={Organization:'Spawn/Organization.png',Start:'Spawn/Start.png',Last:'Spawn/Last.png',Parking:'Spawn/Parking.png',Home:'Spawn/Home.png'};
const eye='<svg width="28" height="24" viewBox="0 0 28 24"><ellipse cx="14" cy="12" rx="12" ry="7" fill="none" stroke="white" stroke-width="2"/><circle cx="14" cy="12" r="4" fill="white"/></svg>';
function passfield(id,hint){return `<div class="passwordfield"><input type="password" id="${id}" placeholder="${hint}"><button class="eye" aria-label="Показать пароль">${eye}</button></div>`}
function show(next){scene=next;sceneSelect.value=next;screen.className='screen '+(scene==='login'?'art':['password','return'].includes(scene)?'accountart':scene==='spawn'?'spawnart':'world')+(scene==='chat'?' chatview':'');let content='';resize();
 if(scene==='login')content=`<section class="identity"><input id="first" placeholder="Введите имя" value="${esc(first)}" autocomplete="off"><input id="last" placeholder="Введите фамилию" value="${esc(last)}" autocomplete="off"><div id="error" class="error"></div></section><button class="primary next" id="next">ИГРАТЬ</button>`;
 if(scene==='password'||scene==='return')content=`<h1 class="pageheading">${scene==='return'?'АВТОРИЗАЦИЯ':'РЕГИСТРАЦИЯ'}</h1><div class="nick">${esc(nickname)}</div><section class="account ${scene==='return'?'returning':''}">${passfield('password','Пароль')}${scene==='return'?'':passfield('confirm','Повторите пароль')}<button class="primary submit" id="auth">ВОЙТИ</button><button class="back" onclick="show('login')">Назад</button><div id="error" class="error"></div></section>`;
 if(scene==='spawn'){const cards=[['Organization','Организация',false],['Start','Площадь',true],['Last','Место выхода',true],['Parking','Парковка',true],['Home','Дом',false]];content=`<h1 class="pageheading spawnheading">Выберите место появления</h1><section class="spawncards">${cards.map(([id,label,available])=>`<button ${available?'':'disabled'} data-spawn="${id}" class="spawncard ${chosenSpawn===id?'selected':''}" style="background-image:url('${SPAWN_ART[id]}')"><b>${label}</b></button>`).join('')}</section><button class="primary spawnenter" onclick="show('hud')">ВОЙТИ</button>`;}
 if(scene==='hud')content=hud();
 if(scene==='gps'){let rows='';if(!gpsGroup){const groups=[['Важные места','Important'],['Работы для новичков','Jobs'],['Государственные организации','Government'],['Транспорт и парковки','Transport'],['Магазины','Shops'],['Жилые дома','Homes'],['Ближайшие места','Nearest']];rows=groups.map((g,i)=>`<button data-group="${g[1]}">${i+1}. ${g[0]}</button>`).join('')}else rows=DATA.places.filter(p=>gpsGroup==='Nearest'||p.group===gpsGroup||gpsGroup==='Important'&&['Government','Jobs','Transport'].includes(p.group)).map(p=>`<button data-place="${p.id}" class="${selectedGPS===p.id?'selected':''}">${esc(p.label)}</button>`).join('');content=hud()+`<div class="darken"></div><section class="panel gps"><h1>GPS · навигация</h1><div class="rows ${gpsGroup?'destinations':''}">${rows}</div>${gpsGroup?'<button class="primary" style="width:100%" id="followgps">ПОСТРОИТЬ МАРШРУТ</button>':''}<footer>${gpsGroup?'<button id="backgps">← Разделы GPS</button>':''}<button onclick="show('hud')">Закрыть</button></footer></section>`+close();}
 if(scene==='map'){const label=selectedPlace?.label||tracked?.label||'',metres=tracked?Math.round(ROUTES.find(x=>x.id===tracked.id).metres):null;content=`<div class="map">${svgMap()}</div><div class="maptitle">КАРТА | ПОЛИЦЕЙСКИЙ РАЙОН</div><button class="legendtoggle" onclick="document.querySelector('.legend').style.display=document.querySelector('.legend').style.display==='block'?'none':'block'">Легенда ↓</button><button class="opengps" onclick="gpsGroup='';show('gps')">GPS</button><div class="legend">Полиция · синяя метка<br>Больница · красная метка<br>Курьер · оранжевая метка<br>Дома · зелёная метка<br>P · парковка　Сумка · магазины<br>Оранжевая линия — маршрут<br>Пунктир — подход к точке</div>${close()}${label?`<section class="mapinfo"><h2>${esc(label)}</h2>${metres===null?'':`<p>Маршрут: ${metres} м</p>`}<button class="primary" id="track">${selectedPlace?'ПОСТРОИТЬ МАРШРУТ':'УБРАТЬ МАРШРУТ'}</button></section>`:''}`;}
 if(scene==='chat')content=hud()+`<div class="channels">${['RP чат','NRP чат','Крик','Действие'].map((s,i)=>`<button data-channel="${i}" class="${channel===i?'selected':''}">${s}</button>`).join('')}<button class="history">↑</button><button>↓</button></div><div class="draft"><span id="draft">${esc(draft)}</span><span class="caret">│</span></div><div class="keyboard"></div>${close()}`;
 screen.innerHTML=content;bind();}
function bind(){if(scene==='login'){document.querySelector('#next').onclick=()=>{first=document.querySelector('#first').value.trim();last=document.querySelector('#last').value.trim();if(!/^[a-z]{2,20}$/i.test(first)||!/^[a-z]{2,20}$/i.test(last)){document.querySelector('#error').textContent='Имя и фамилия: по 2–20 английских букв.';return}nickname=first+'_'+last;show('password')}}
 if(['password','return'].includes(scene)){document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>document.querySelectorAll('input').forEach(i=>i.type=i.type==='password'?'text':'password'));document.querySelector('#auth').onclick=()=>{const p=document.querySelector('#password').value;if(p.length<6||p.length>64){document.querySelector('#error').textContent='Пароль должен содержать от 6 до 64 символов.';return}if(scene!=='return'&&p!==document.querySelector('#confirm').value){document.querySelector('#error').textContent='Пароли не совпадают.';return}show('spawn')}}
 if(scene==='spawn')document.querySelectorAll('[data-spawn]').forEach(b=>b.onclick=()=>{chosenSpawn=b.dataset.spawn;show('spawn')});
 if(scene==='gps'){document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{gpsGroup=b.dataset.group;selectedGPS=null;show('gps')});document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{selectedGPS=b.dataset.place;show('gps')});const follow=document.querySelector('#followgps');if(follow)follow.onclick=()=>{if(selectedGPS){tracked=DATA.places.find(p=>p.id===selectedGPS);show('hud')}};const back=document.querySelector('#backgps');if(back)back.onclick=()=>{gpsGroup='';show('gps')}}
 if(scene==='map'){document.querySelectorAll('.poi').forEach(g=>g.onclick=e=>{e.stopPropagation();selectedPlace=DATA.places.find(p=>p.id===g.dataset.id);show('map')});const track=document.querySelector('#track');if(track)track.onclick=()=>{if(selectedPlace){tracked=selectedPlace;selectedPlace=null}else tracked=null;show('map')}}
 if(scene==='chat'){document.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{channel=+b.dataset.channel;show('chat')});keyboard()}}
function type(value){draft=(draft+value).slice(0,180);document.querySelector('#draft').textContent=draft}function erase(){draft=Array.from(draft).slice(0,-1).join('');document.querySelector('#draft').textContent=draft}
function send(){if(draft==='/gps'){draft='';gpsGroup='';show('gps')}else if(draft==='/map'){draft='';show('map')}else{draft='';show('hud')}}
function keyboard(){const box=document.querySelector('.keyboard');box.innerHTML='';const rows=symbols?['1234567890','@#₽%&*()-+','_=:;"\'?!.']:ru?['йцукенгшщзхъ','фывапролджэ','ячсмитьбю']:['qwertyuiop','asdfghjkl','zxcvbnm'];function key(row,label,fn,weight=1,primary=false){const b=document.createElement('button');b.className='key'+(primary?' primary':'');b.textContent=label;b.style.flex=weight;b.onclick=fn;row.append(b)}rows.forEach((r,i)=>{const row=document.createElement('div');row.className='keyrow';if(i===2)key(row,shift?'⇧ ON':'⇧',()=>{shift=!shift;keyboard()});for(let ch of r){const value=shift?ch.toUpperCase():ch;key(row,value,()=>{type(value);if(shift&&!symbols){shift=false;keyboard()}})}if(i===2)key(row,'⌫',erase);box.append(row)});const row=document.createElement('div');row.className='keyrow';key(row,'/',()=>type('/'));key(row,ru?'RU':'EN',()=>{ru=!ru;symbols=false;keyboard()});key(row,symbols?'ABC':'123',()=>{symbols=!symbols;keyboard()});key(row,'Пробел',()=>type(' '),5);key(row,',',()=>type(','));key(row,'.',()=>type('.'));key(row,'→',send,1.6,true);box.append(row)}
addEventListener('keydown',e=>{if(scene!=='chat')return;if(e.key==='Backspace'){e.preventDefault();erase()}else if(e.key==='Enter'){e.preventDefault();send()}else if(e.key==='Escape')show('hud');else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey)type(e.key)});
sceneSelect.onchange=()=>show(sceneSelect.value);show(new URLSearchParams(location.search).get('scene')||'login');
</script></html>
